[project]
name = "udp-link"
version = "1.0.0"
description = "Async, acknowledged, HMAC-authenticated string exchange over UDP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["opencv-python-headless", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["udp_link", "video_link"]
