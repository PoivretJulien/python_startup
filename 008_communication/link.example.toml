# Copy to link.toml on BOTH machines (same content), then: chmod 600 link.toml
# Env vars UDP_LINK_SERVER_IP / UDP_LINK_PORT / UDP_LINK_SECRET override these.
[link]
server_ip = "192.168.1.50"   # LAN IP of server_side  (find it with: python3 -m udp_link ip)
bind_ip   = "0.0.0.0"        # server listens on all interfaces (or put the IP of server_side)
port      = 50555
secret    = "CHANGE-ME-run-python3-m-udp_link-keygen"

# Optional tuning
# ack_timeout        = 0.3
# max_retries        = 5
# heartbeat_interval = 5.0     # 0 = no heartbeat
# peer_ttl           = 20.0    # 0 = never forget clients on a timer
#   Low power, same values on both machines (see "Idle mode" in udp_link/README.md):
#     idle mode:            heartbeat_interval = 0,  peer_ttl = 0
#     listen-only clients:  heartbeat_interval = 50, peer_ttl = 180
# max_clock_skew     = 120.0   # set 0 if the machines have no NTP / internet
# allowed_hosts      = ["192.168.1.20"]   # server: only accept these client IPs

# Video streaming (video_link) -- optional, defaults shown
# [video]
# port            = 50556
# max_subscribers = 4
# subscribe_interval = 1.0   # 0 = idle mode (see video_link/README.md), 50 = slow keep-alive
